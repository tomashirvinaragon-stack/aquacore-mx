<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pago aprobado | AquaCore MX</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f8fb;color:#062b4d;display:grid;place-items:center;min-height:100vh}.card{width:min(92vw,560px);background:#fff;border-radius:24px;padding:34px;box-shadow:0 20px 60px rgba(6,43,77,.14);text-align:center}.logo{width:260px;max-width:80%;margin-bottom:18px}.icon{width:78px;height:78px;border-radius:50%;background:#e5f8ef;color:#0a9c5b;display:grid;place-items:center;font-size:44px;margin:0 auto 18px}h1{font-size:34px;margin:8px 0 12px}p{color:#587083;line-height:1.55}.folio{font-weight:700;color:#062b4d}.btn{display:inline-block;margin-top:18px;padding:14px 22px;border-radius:999px;background:#086aa6;color:#fff;text-decoration:none;font-weight:700}.small{font-size:13px;margin-top:16px}</style></head><body><main class="card"><img class="logo" src="/assets/logo.svg" alt="AquaCore MX"><div class="icon">✓</div><h1>Pago aprobado</h1><p>Mercado Pago reportó tu pago como aprobado. Estamos registrando tu pedido.</p><p class="folio" id="folio"></p><p id="operation"></p><a class="btn" href="/">Volver a AquaCore MX</a><p class="small">Conserva tu comprobante de Mercado Pago para cualquier aclaración.</p></main><script>const q=new URLSearchParams(location.search);const folio=q.get('folio')||'';const payment=q.get('payment_id')||q.get('collection_id')||'';document.getElementById('folio').textContent=folio?`Folio: ${folio}`:'';document.getElementById('operation').textContent=payment?`Operación Mercado Pago: ${payment}`:'';if((q.get('status')==='approved'||q.get('collection_status')==='approved')){localStorage.removeItem('aquacore-cart-v2');}</script></body></html>
